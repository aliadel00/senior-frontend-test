name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: task-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate mock data
        run: npm run data:generate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:coverage

      - name: i18n catalog parity (en/ar)
        run: npm run test:i18n

      - name: Content accessibility audit
        run: npm run test:content-a11y

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Axe accessibility (WCAG 2.1 AA)
        run: npm run test:a11y

      - name: Lighthouse performance (>90)
        run: npm run test:lighthouse
        env:
          LHCI_SKIP_BUILD: '1'
