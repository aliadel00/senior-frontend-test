<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="shell__nav" [fixedInViewport]="true">
    <div class="shell__brand">
      <mat-icon aria-hidden="true">task_alt</mat-icon>
      <span>TaskFlow</span>
    </div>
    <mat-nav-list>
      @for (link of links; track link.path) {
        <a
          mat-list-item
          [routerLink]="link.path"
          routerLinkActive="active"
          [attr.aria-label]="link.label"
        >
          <mat-icon matListItemIcon aria-hidden="true">{{ link.icon }}</mat-icon>
          <span matListItemTitle>{{ link.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="shell__toolbar">
      <span>Senior Frontend Assessment</span>
    </mat-toolbar>
    <main class="shell__content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
