<mat-card class="stat-card" [style.--accent]="statistic().color">
  <div class="stat-card__header">
    <span class="stat-card__title">{{ statistic().title }}</span>
    <mat-icon class="stat-card__icon" aria-hidden="true">{{ statistic().icon }}</mat-icon>
  </div>
  <p class="stat-card__value">{{ statistic().value }}</p>
  <p class="stat-card__change" [class]="'stat-card__change--' + statistic().changeType">
    <span>{{ statistic().change }}</span>
    <span>{{ statistic().changeLabel }}</span>
  </p>
</mat-card>
