<article
  class="task-card"
  [class.task-card--overdue]="task().isOverdue && task().status !== 'done'"
>
  <div class="task-card__top">
    <span class="priority" [attr.data-priority]="task().priority">
      {{ priorityLabel() }}
    </span>
    <button
      type="button"
      class="task-card__menu"
      [matMenuTriggerFor]="menu"
      [attr.aria-label]="actionsAria()"
    >
      <mat-icon aria-hidden="true">more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item type="button" (click)="edit.emit(task())">
        <mat-icon aria-hidden="true">edit</mat-icon>
        <span>{{ m().edit }}</span>
      </button>
      <button mat-menu-item type="button" (click)="remove.emit(task())">
        <mat-icon aria-hidden="true">delete</mat-icon>
        <span>{{ m().delete }}</span>
      </button>
    </mat-menu>
  </div>

  <h3 class="task-card__title">{{ task().title }}</h3>
  <p class="task-card__desc">{{ task().description }}</p>

  <p class="task-card__due" [attr.data-tone]="dueLabel().tone">
    @if (dueLabel().tone === 'danger') {
      <mat-icon aria-hidden="true">warning</mat-icon>
    } @else if (dueLabel().tone === 'success') {
      <mat-icon aria-hidden="true">check_circle</mat-icon>
    } @else {
      <mat-icon aria-hidden="true">calendar_today</mat-icon>
    }
    <span>{{ dueLabel().text }}</span>
  </p>

  <p class="task-card__category">{{ category() }}</p>

  <footer class="task-card__footer">
    <span class="assignee__avatar" aria-hidden="true">{{ initials() }}</span>
    <span class="assignee__name">{{ handle() }}</span>
  </footer>
</article>
