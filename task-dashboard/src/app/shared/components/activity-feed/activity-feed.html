<section class="activity" [attr.aria-label]="m().activityAria">
  @if (!items().length) {
    <p class="activity__empty">{{ m().activityEmpty }}</p>
  } @else {
    <ul class="feed" tabindex="0" [attr.aria-label]="m().activityItems">
      @for (item of items(); track item.id) {
        <li class="feed__item">
          <p class="feed__title">{{ item.taskTitle }}</p>
          <p class="feed__meta">
            {{ item.actor }} · {{ actionLabel(item.action) }} ·
            {{ item.timestamp | date: 'short' }}
          </p>
        </li>
      }
    </ul>
  }
</section>
