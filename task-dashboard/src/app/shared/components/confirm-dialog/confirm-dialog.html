<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">
    {{ cancelLabel() }}
  </button>
  <button
    mat-flat-button
    class="confirm-dialog__danger"
    type="button"
    (click)="confirm()"
  >
    {{ confirmLabel() }}
  </button>
</mat-dialog-actions>
