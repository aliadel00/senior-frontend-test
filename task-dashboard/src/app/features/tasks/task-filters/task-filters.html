<section class="filters" [attr.aria-label]="m().taskFilters">
  <div class="filters__tabs" role="tablist" [attr.aria-label]="m().statusFilter" tabindex="0">
    @for (tab of statusTabs(); track tab.value) {
      <button
        type="button"
        class="tab"
        role="tab"
        [class.tab--active]="filters().status === tab.value"
        [attr.aria-selected]="filters().status === tab.value"
        (click)="statusChange.emit(tab.value)"
      >
        {{ tab.label }}
      </button>
    }
  </div>

  <div class="filters__actions">
    <label class="select" [class.select--placeholder]="filters().priority === 'all'">
      <span class="sr-only">{{ m().filterPriority }}</span>
      <select
        [ngModel]="priorityValue()"
        (ngModelChange)="onPriorityChange($event)"
        [attr.aria-label]="m().filterByPriority"
      >
        <option value="" disabled hidden>{{ m().filterPriority }}</option>
        <option value="all">{{ m().filterNone }}</option>
        @for (priority of priorities; track priority) {
          <option [value]="priority">{{ priorityLabel(priority) }}</option>
        }
      </select>
      <span class="select__chevron" aria-hidden="true">
        <mat-icon>expand_more</mat-icon>
      </span>
    </label>

    <label class="select" [class.select--placeholder]="filters().assigneeId === 'all'">
      <span class="sr-only">{{ m().filterAssignee }}</span>
      <select
        [ngModel]="assigneeValue()"
        (ngModelChange)="onAssigneeChange($event)"
        [attr.aria-label]="m().filterByAssignee"
      >
        <option value="" disabled hidden>{{ m().filterAssignee }}</option>
        <option value="all">{{ m().filterNone }}</option>
        @for (user of assignees(); track user.id) {
          <option [value]="user.id">{{ user.name }}</option>
        }
      </select>
      <span class="select__chevron" aria-hidden="true">
        <mat-icon>expand_more</mat-icon>
      </span>
    </label>

    <button class="btn-primary" type="button" (click)="createRequested.emit()">
      <mat-icon aria-hidden="true">add</mat-icon>
      {{ m().newTask }}
    </button>
  </div>
</section>
