<section class="filters" aria-label="Task filters">
  <mat-form-field appearance="outline" class="filters__search">
    <mat-label>Search tasks</mat-label>
    <input
      matInput
      type="search"
      [ngModel]="filters().search"
      (ngModelChange)="searchChange.emit($event)"
      placeholder="Title or description"
    />
    <mat-icon matSuffix aria-hidden="true">search</mat-icon>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Status</mat-label>
    <mat-select
      [ngModel]="filters().status"
      (ngModelChange)="statusChange.emit($event)"
    >
      <mat-option value="all">All</mat-option>
      @for (status of statuses; track status) {
        <mat-option [value]="status">{{ statusLabels[status] }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Priority</mat-label>
    <mat-select
      [ngModel]="filters().priority"
      (ngModelChange)="priorityChange.emit($event)"
    >
      <mat-option value="all">All</mat-option>
      @for (priority of priorities; track priority) {
        <mat-option [value]="priority">{{ priorityLabels[priority] }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Assignee</mat-label>
    <mat-select
      [ngModel]="filters().assigneeId"
      (ngModelChange)="assigneeChange.emit($event)"
    >
      <mat-option value="all">All</mat-option>
      @for (user of assignees(); track user.id) {
        <mat-option [value]="user.id">{{ user.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <button mat-stroked-button type="button" (click)="cleared.emit()">
    <mat-icon>filter_alt_off</mat-icon>
    Reset
  </button>
</section>
