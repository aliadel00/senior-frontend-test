<section class="users">
  <header>
    <h1>{{ m().teamTitle }}</h1>
    <p>{{ m().teamSubtitle }}</p>
  </header>

  @if (loading()) {
    <app-loading-skeleton variant="users" [label]="m().loadingUsers" />
  } @else {
    <ul class="users__list enter">
      @for (user of assignees(); track user.id; let i = $index) {
        <li class="users__item enter-item" [style.--enter-i]="i">
          <span class="users__avatar" aria-hidden="true">{{ initials(user.name) }}</span>
          <div class="users__meta">
            <p class="users__name">{{ user.name }}</p>
            <p class="users__detail">{{ user.email }} · {{ taskCountLabel(user.id) }}</p>
          </div>
        </li>
      }
    </ul>
  }
</section>
