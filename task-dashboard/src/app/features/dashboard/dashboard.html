<section class="dashboard">
  @if (error()) {
    <div class="dashboard__error" role="alert">
      <p>{{ m().loadDashboardError }}</p>
      <button class="btn btn--ghost" type="button" (click)="refresh()">{{ m().retry }}</button>
    </div>
  }

  @if (loading()) {
    <app-loading-skeleton variant="dashboard" [label]="m().loadingDashboard" />
  } @else {
    <div class="dashboard__stats">
      @for (stat of statistics(); track stat.id; let i = $index) {
        <div class="enter-item" [style.--enter-i]="i">
          <app-stat-card [statistic]="stat" />
        </div>
      }
    </div>

    <div class="dashboard__toolbar enter-item" style="--enter-i: 4">
      <app-task-filters
        [filters]="filters()"
        [assignees]="assignees()"
        (statusChange)="onStatusChange($event)"
        (priorityChange)="onPriorityChange($event)"
        (assigneeChange)="onAssigneeChange($event)"
        (searchChange)="onSearchChange($event)"
        (cleared)="resetFilters()"
        (createRequested)="openCreate()"
      />
    </div>

    <section
      id="task-board"
      class="dashboard__board"
      [attr.aria-label]="m().taskBoard"
    >
      <app-task-list
        [tasks]="filteredTasks()"
        (edit)="openEdit($event)"
        (remove)="confirmDelete($event)"
        (reorder)="onReorder($event)"
      />
    </section>
  }
</section>
